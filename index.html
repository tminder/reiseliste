<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-transparent.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cart" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>Cart on the Road</title>
    <meta name="description" content="Die Einkaufsliste für die Reise: Du schreibst in deiner Sprache, im Laden steht jeder Artikel in der Landessprache. Gratis, ohne Konto, mit anderen teilbar." />
    <!-- Die App selbst nicht in Suchergebnissen: dort sollen die Startseiten /de/ und /en/ erscheinen (D-091). Vorschau beim Teilen bleibt. -->
    <meta name="robots" content="noindex" />
    <!-- Vorschau beim Teilen (WhatsApp, iMessage, Signal …). Listen-Links zeigen dieselbe Vorschau: der Listenname liegt hinter dem # -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cart on the Road" />
    <meta property="og:title" content="Cart on the Road" />
    <meta property="og:description" content="Deine Einkaufsliste für die Reise. Im Laden in der Landessprache." />
    <meta property="og:url" content="https://cartontheroad.app/" />
    <meta property="og:image" content="https://cartontheroad.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo von Cart on the Road: Milch wird zu leche, lait, latte" />
    <meta property="og:locale" content="de_CH" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Startbildschirm bis die App geladen ist (D-083): erscheint erst nach 0,3 s, damit er bei schnellem Laden nicht aufblitzt -->
    <style>
      html { background: #f8fafc; }
      @media (prefers-color-scheme: dark) { html { background: #0b1120; } }
      .splash { display: flex; align-items: center; justify-content: center; height: 100vh; height: 100dvh; opacity: 0; animation: splash-in 0.4s ease 0.3s forwards; }
      .splash img { width: 88px; height: 88px; }
      @keyframes splash-in { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .splash { animation-duration: 0s; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="splash" aria-label="Cart on the Road wird geladen" role="status"><img src="/favicon.svg" alt="" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
