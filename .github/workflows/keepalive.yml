# Supabase wach halten (D-039): Gratis-Projekte werden nach 7 Tagen ohne Datenbank-Aktivität pausiert.
# Ruft täglich die Funktion ping() auf (schreibt einen Zeitstempel in die Tabelle keepalive).
# URL und Publishable Key stehen ohnehin öffentlich in .env.production – es braucht kein Secret.

name: Supabase wach halten

on:
  schedule:
    - cron: '37 4 * * *' # täglich 04:37 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          set -a; . ./.env.production; set +a
          URL="$VITE_SUPABASE_URL"
          KEY="$VITE_SUPABASE_ANON_KEY"
          # 1. Bevorzugt: kleine Schreibaktion über ping()
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "ping(): HTTP $code $(cat /tmp/out)"
          if [ "$code" = "200" ]; then exit 0; fi
          # 2. Falls ping() noch fehlt (schema.sql nicht ausgeführt): einfache Leseanfrage
          code=$(curl -s -o /tmp/out -w '%{http_code}' "$URL/rest/v1/lists?select=id&limit=1" -H "apikey: $KEY")
          echo "Leseanfrage: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase antwortet nicht (HTTP $code). Ist das Projekt pausiert? Im Dashboard „Resume project“."
            exit 1
          fi
          echo "::warning::ping() fehlt – bitte supabase/schema.sql erneut ausführen."
